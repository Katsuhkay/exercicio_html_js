<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário EBAC</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        Formulário de atividade EBAC
    </header>
    <main>
        <form id="formulario">
            <label for="nome">Nome completo: </label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">Seu email: </label>
            <input type="email" name="email" id="email" required>

            <label for="senha">Digite sua senha:</label>
            <input type="password" name="senha" id="senha" required>

            <label for="botaoA">Digite o primeiro número:</label>
            <input type="number" name="botaoA" id="botaoA" required>

            <label for="botaoB">Digite o segundo número:</label>
            <input type="number" name="botaoB" id="botaoB" required>

            <input type="submit" value="Enviar" id="btnEnviar">
            <input type="reset" value="Limpar" id="btnLimpar">
        </form>
    </main>
    <script src="js/scripts.js"></script>
</body>
</html>
